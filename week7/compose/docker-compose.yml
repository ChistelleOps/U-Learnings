services:
  mysql: 
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: test
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
  Adminer:
    image: adminer:5
    ports: 
      - "8080:8080"
    depends_on:
      - mysql